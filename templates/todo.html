{% extends 'base.html'%}
{% block content %}
<section class="add-todo-hero-section" style="background-image: url('{{specific_todo.img}}')">
    <h1 class="add-todo-title">{{specific_todo.title}}</h1>
</section>
<section class="hero-section">
    <div class="hero-text">
        <p>{{specific_todo.description | safe}}</p>
    </div>
    <div class="task-control">
        <a class="checked" href="{{url_for('completed_todo',todo_id=specific_todo.id)}}">
            <i class="fa-solid fa-circle-check checked-icon"></i>
        </a>
        <a class="edit" href="{{url_for('edit',todo_id=specific_todo.id)}}">
            <i class="fa-solid fa-pen-to-square edit-icon"></i></a>
        <a class="delete" href="{{url_for('delete',todo_id=specific_todo.id)}}">
            <i class="fa-solid fa-trash-can delete-icon"></i>
        </a>
    </div>
</section>
{% endblock %}
